<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="app-repo" content="BEAMS">
<meta name="app-version" content="0.1.3">
<meta name="theme-color" content="#16171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BEAMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --page:#16171a; --board:#202226; --board2:#1a1c1f; --line:rgba(64,224,255,.10); --neon:#40e0ff;
  --gold:#ffcf5c; --goldcore:#fff4d6; --stray:#ff3d63; --ink:#e9e6dc; --dim:#8b8f98; --faint:#4a4e57;
  --silver:#cfd3da; --glass:rgba(16,18,22,.86);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:'Share Tech Mono',ui-monospace,monospace;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 10px)}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid #2c2f35;color:var(--dim);font-size:20px;flex:none}
.back:active{background:#23262b}
.ttl{font-family:Orbitron,sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em}
.sub{color:var(--dim);font-size:13px}
.ver{color:var(--faint);font-size:11px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;margin:0 -16px;padding:0 16px}

/* title */
#s-title{padding:0}
#hero{position:absolute;inset:0;width:100%;height:100%}
.tbody{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:calc(var(--safe-t) + 18vh) 28px calc(var(--safe-b) + 22px)}
.mark{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(54px,17vw,84px);letter-spacing:.14em;margin:0;line-height:1;color:var(--goldcore);
  text-shadow:0 0 6px rgba(255,207,92,.9),0 0 22px rgba(255,170,40,.55),0 0 60px rgba(255,150,30,.35)}
.tag{color:var(--dim);margin:14px 0 0;font-size:14px;max-width:24em;line-height:1.5}
.tver{margin-top:6px}
.menu{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px;border:1px solid #2b2e34;border-radius:14px;background:rgba(22,23,26,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:16px;text-align:left}
.mbtn b{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.05em;font-size:15px}
.mbtn span{color:var(--dim);font-size:12px}
.mbtn.primary{border-color:rgba(255,207,92,.55);box-shadow:0 0 0 1px rgba(255,207,92,.12) inset,0 0 24px rgba(255,190,60,.08)}
.mbtn.primary b{color:var(--gold)}
.mbtn:active{transform:scale(.985)}

/* packs */
.pack{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid #24272c;text-align:left;width:100%}
.pack .pn{font-family:Orbitron,sans-serif;font-weight:700;font-size:22px;color:var(--faint);text-align:center}
.pack.open .pn{color:var(--gold);text-shadow:0 0 12px rgba(255,190,60,.5)}
.pack h3{margin:0;font-family:Orbitron,sans-serif;font-size:15px;font-weight:700;letter-spacing:.05em}
.pack p{margin:3px 0 0;color:var(--dim);font-size:13px;line-height:1.35}
.pack .ps{font-size:13px;color:var(--dim);text-align:right;white-space:nowrap}
.pack.locked h3{color:var(--dim)} .pack.soon h3{color:var(--faint)}
.bar{height:2px;background:#2a2d33;border-radius:2px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* levels */
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 0 20px}
.lv{aspect-ratio:1/1.1;border:1px solid #2b2e34;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:9px;text-align:left;background:var(--board2);position:relative;overflow:hidden}
.lv canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.lv .n{font-family:Orbitron,sans-serif;font-weight:700;font-size:18px;position:relative}
.lv .nm{font-size:11px;color:var(--dim);position:relative;line-height:1.2}
.lv .st{position:relative;font-size:13px;letter-spacing:2px;color:var(--faint)}
.lv .st .on{color:var(--gold);text-shadow:0 0 6px rgba(255,190,60,.7)}
.lv.lock{opacity:.35}
.lv.done{border-color:rgba(255,207,92,.35)}

/* game */
#s-game{padding-left:10px;padding-right:10px}
.ghead{display:flex;align-items:center;gap:10px}
.gt{flex:1;min-width:0}
.gt .ttl{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarms{text-align:right;min-width:96px}
.pips{display:flex;gap:5px;justify-content:flex-end;height:14px;align-items:center;flex-wrap:wrap}
.pip{width:12px;height:12px;border-radius:3px;display:block}
.pip.exp{border:1.5px solid rgba(255,255,255,.75)}
.pip.exp.used{background:rgba(255,255,255,.55);border-color:transparent}
.pip.over{background:var(--stray);box-shadow:0 0 8px rgba(255,61,99,.7)}
.pip.none{width:14px;height:2px;background:var(--faint);border-radius:1px}
.pip.pop{animation:pop .6s ease-out}
.pip.exp.pop{animation:popw .7s ease-out}
@keyframes pop{0%{transform:scale(1.9);box-shadow:0 0 18px #ff3d63}100%{transform:scale(1)}}
@keyframes popw{0%{transform:scale(1.9);background:#fff;box-shadow:0 0 16px #fff}100%{transform:scale(1)}}
.al{font-size:11px;color:var(--dim);margin-top:5px;white-space:nowrap}
.al .bad{color:var(--stray)}
.boardwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{touch-action:none;border-radius:10px}
.status{height:22px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:13px;color:var(--dim);margin:4px 0 6px}
.status .bad{color:var(--stray)} .status .good{color:var(--gold)} .status .warn{color:#ffaa50} .status .pv{color:var(--neon)}
.tray{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;min-height:86px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.chip{flex:none;width:74px;height:78px;border:1px solid #2b2e34;border-radius:12px;background:var(--board2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;touch-action:none}
.chip canvas{width:46px;height:46px}
.chip .cn{font-size:10px;color:var(--dim);line-height:1.1;text-align:center;padding:0 3px}
.chip .cc{position:absolute;top:4px;right:6px;font-size:12px;color:var(--ink)}
.chip.empty{opacity:.3}
.chip.armed{border-color:var(--neon);box-shadow:0 0 0 1px rgba(64,224,255,.25) inset,0 0 14px rgba(64,224,255,.15)}
.chip .new{position:absolute;top:4px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}
.ctrl{display:grid;grid-template-columns:52px 52px 1fr;gap:8px}
.cb{height:52px;border:1px solid #2b2e34;border-radius:12px;font-size:20px;color:var(--ink);display:grid;place-items:center}
.cb:disabled{opacity:.3}
.cb:active{background:#23262b}
.place{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.12em;font-size:15px;color:var(--dim);border-color:#2b2e34}
.place.ready{color:#1a1306;background:linear-gradient(180deg,#ffe08f,#ffbf3c);border:0;box-shadow:0 0 22px rgba(255,180,50,.35)}
.place.ready:active{filter:brightness(.92)}
.place:disabled{opacity:.45}
.ghost{position:fixed;pointer-events:none;z-index:50;width:64px;height:64px;margin:-32px 0 0 -32px;opacity:.9;display:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(8,9,10,.55)}
.sheet.on{display:flex}
.card{width:100%;max-width:480px;background:#1d1f23;border:1px solid #2f3238;border-bottom:0;border-radius:20px 20px 0 0;padding:22px 22px calc(var(--safe-b) + 18px)}
.card h2{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.06em;margin:0 0 4px;font-size:22px;color:var(--gold)}
.card .stars{font-size:34px;letter-spacing:8px;margin:12px 0;color:var(--faint)}
.card .stars .on{color:var(--gold);text-shadow:0 0 14px rgba(255,190,60,.8)}
.card ul{list-style:none;padding:0;margin:0 0 18px;color:var(--dim);font-size:14px;line-height:1.8}
.card ul li.ok{color:var(--ink)}
.row{display:flex;gap:10px}.row button{flex:1;height:52px;border-radius:12px;border:1px solid #2f3238;font-size:15px}
.row .go{background:var(--gold);color:#1a1306;border:0;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.06em}

/* lab */
.lsec{color:var(--dim);font-size:13px;margin:18px 0 6px}
.litem{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;padding:8px 0;border-bottom:1px solid #22252a;text-align:left}
.litem canvas{width:52px;height:52px;background:var(--board2);border-radius:10px}
.litem b{font-weight:400;font-size:15px}
.litem small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.litem .tagp{font-size:11px;color:var(--faint);white-space:nowrap}
.litem.locked{opacity:.4}
#bench{touch-action:none;border-radius:10px;align-self:center}
.bdesc{font-size:15px;line-height:1.5;margin:14px 2px 6px;max-width:30em}
.bfacts{color:var(--dim);font-size:13px;margin:0 2px 12px}
.seg{display:flex;border:1px solid #2b2e34;border-radius:12px;overflow:hidden;margin-top:auto}
.seg button{flex:1;height:46px;font-size:13px;color:var(--dim);border-right:1px solid #2b2e34}
.seg button:last-child{border-right:0}
.seg button.on{color:var(--page);background:var(--gold)}

/* settings */
.set{display:flex;justify-content:space-between;align-items:center;padding:16px 2px;border-bottom:1px solid #24272c;width:100%;text-align:left;font-size:15px}
.set small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.tog{width:46px;height:28px;border-radius:14px;background:#2c2f35;position:relative;flex:none;transition:background .15s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
.tog.on{background:rgba(255,207,92,.3)}.tog.on::after{left:21px;background:var(--gold)}
.danger{color:var(--stray)}
.foot{margin-top:auto;padding-top:18px;color:var(--faint);font-size:12px;line-height:1.7}
.foot a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script data-goatcounter="https://s77ffy.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="app">
  <section class="screen on" id="s-title">
    <canvas id="hero" aria-hidden="true"></canvas>
    <div class="tbody">
      <h1 class="mark">BEAMS</h1>
      <p class="tag">Bend light with mirrors, lenses and prisms. Every ray has to land somewhere.</p>
      <div class="ver tver" id="ver-title"></div>
      <nav class="menu">
        <button class="mbtn primary" data-go="packs"><b>Play</b><span id="m-progress"></span></button>
        <button class="mbtn" data-go="daily"><b>Daily</b><span id="m-daily"></span></button>
        <button class="mbtn" data-go="lab"><b>Optics Lab</b><span id="m-lab"></span></button>
        <button class="mbtn" data-go="settings"><b>Settings</b><span></span></button>
      </nav>
    </div>
  </section>

  <section class="screen" id="s-packs">
    <div class="top"><button class="back" data-back aria-label="Back">‹</button><div><div class="ttl">Packs</div><div class="ver" data-ver></div></div></div>
    <div class="scroll" id="packlist"></div>
  </section>

  <section class="screen" id="s-levels">
    <div class="top"><button class="back" data-back aria-label="Back">‹</button><div><div class="ttl" id="lv-title"></div><div class="sub" id="lv-sub"></div></div></div>
    <div class="scroll"><div class="lgrid" id="lvgrid"></div></div>
  </section>

  <section class="screen" id="s-game">
    <div class="ghead">
      <button class="back" data-back aria-label="Back">‹</button>
      <div class="gt"><div class="ttl" id="g-title"></div><div class="ver" id="g-sub"></div></div>
      <div class="alarms" id="g-alarms" aria-live="polite"></div>
    </div>
    <div class="boardwrap" id="boardwrap"><canvas id="board"></canvas></div>
    <div class="status" id="status"></div>
    <div class="tray" id="tray"></div>
    <div class="ctrl">
      <button class="cb" id="b-undo" aria-label="Undo">↶</button>
      <button class="cb" id="b-reset" aria-label="Restart level">↻</button>
      <button class="cb place" id="b-place">PLACE</button>
    </div>
  </section>

  <section class="screen" id="s-lab">
    <div class="top"><button class="back" data-back aria-label="Back">‹</button><div><div class="ttl">Optics Lab</div><div class="sub">Tap a piece on the bench to turn it</div></div></div>
    <div class="scroll" id="lablist"></div>
  </section>

  <section class="screen" id="s-bench">
    <div class="top"><button class="back" data-back aria-label="Back">‹</button><div><div class="ttl" id="bn-title"></div><div class="sub" id="bn-sub"></div></div></div>
    <canvas id="bench"></canvas>
    <p class="bdesc" id="bn-desc"></p>
    <p class="bfacts" id="bn-facts"></p>
    <div class="seg" id="bn-src"></div>
  </section>

  <section class="screen" id="s-settings">
    <div class="top"><button class="back" data-back aria-label="Back">‹</button><div class="ttl">Settings</div></div>
    <button class="set" data-set="haptics"><span>Haptics<small>A short buzz on engage and failure, where the browser allows it</small></span><i class="tog"></i></button>
    <button class="set" data-set="sound"><span>Sound<small>Soft tones for placing pieces and results</small></span><i class="tog"></i></button>
    <button class="set" data-set="focal"><span>Focal points<small>Show where a selected lens or curved mirror focuses</small></span><i class="tog"></i></button>
    <button class="set danger" id="reset-progress"><span>Reset progress<small>Clears stars and unlocked packs on this device</small></span></button>
    <div class="foot"><div id="ver-set"></div><div id="visits"></div><a href="https://buymeacoffee.com/benstiffi" target="_blank" rel="noopener">Buy me a coffee</a></div>
  </section>
</div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>
<canvas class="ghost" id="ghost" width="128" height="128"></canvas>

<script id="core">
/* BEAMS optics engine — shared by the game and the Node test harness. */
(function (root) {
'use strict';
const EPS = 1e-7;
const MASK = { Y: 8, R: 1, G: 2, B: 4, W: 7 };
const MASK_NAME = { 8: 'Y', 1: 'R', 2: 'G', 4: 'B', 7: 'W' };
// refractive index per colour (dispersion deliberately exaggerated so it reads on a small grid)
function nFor(mask) { return mask === 1 ? 1.46 : mask === 2 ? 1.53 : mask === 4 ? 1.64 : 1.52; }

const v = (x, y) => ({ x, y });
const add = (a, b) => v(a.x + b.x, a.y + b.y);
const sub = (a, b) => v(a.x - b.x, a.y - b.y);
const mul = (a, s) => v(a.x * s, a.y * s);
const dot = (a, b) => a.x * b.x + a.y * b.y;
const norm = a => { const l = Math.hypot(a.x, a.y) || 1; return v(a.x / l, a.y / l); };
const perp = a => v(-a.y, a.x);
const rotv = (p, ang) => { const c = Math.cos(ang), s = Math.sin(ang); return v(p.x * c - p.y * s, p.x * s + p.y * c); };
const reflect = (d, n) => sub(d, mul(n, 2 * dot(d, n)));

/* ---------- piece catalogue ----------
   Geometry in cell units around the cell centre; local +x is the piece's facing / optical axis.
   rot: number of behaviourally distinct 45° rotations (1, 4 or 8). */
const H = 0.42;
const P = {};
function def(id, o) { o.id = id; P[id] = o; }

def('mirror', { name: 'Plane Mirror', rot: 4, cat: 'mirror',
  desc: 'Two-sided silvered strip. Angle in equals angle out.',
  geo: () => [{ k: 'seg', a: v(-H, 0), b: v(H, 0), act: 'mirror' }] });
def('splitter', { name: 'Beam Splitter', rot: 4, cat: 'mirror',
  desc: 'Half-silvered diagonal. Every ray continues straight and also reflects.',
  geo: () => [{ k: 'seg', a: v(-H * 0.95, 0), b: v(H * 0.95, 0), act: 'split' }] });
def('corner', { name: 'Corner Reflector', rot: 8, cat: 'mirror',
  desc: 'Two mirrors at 90°. Sends light straight back the way it came, mirrored across the centre.',
  geo: () => [{ k: 'seg', a: v(0.3, 0), b: v(-0.12, -H), act: 'mirror' }, { k: 'seg', a: v(0.3, 0), b: v(-0.12, H), act: 'mirror' }] });
def('wedge', { name: 'Mirror Wedge', rot: 8, cat: 'mirror',
  desc: 'Two mirrors at a sharp angle. Rays ping-pong toward the tip and turn back out.',
  geo: () => [{ k: 'seg', a: v(0.44, 0), b: v(-0.44, -0.24), act: 'mirror' }, { k: 'seg', a: v(0.44, 0), b: v(-0.44, 0.24), act: 'mirror' }] });

function thinLens(id, name, f, desc, extra) {
  def(id, Object.assign({ name, rot: 4, cat: 'lens', f, desc,
    geo: () => [{ k: 'thin', c: v(0, 0), a: v(1, 0), h: H, f, kind: 'lens' }] }, extra || {}));
}
thinLens('convex', 'Convex Lens', 2, 'Bends parallel light to a focus 2 cells away, on either side.');
thinLens('concave', 'Concave Lens', -1, 'Spreads parallel light as if it came from a point 1 cell behind it.');
thinLens('planoconvex', 'Plano-Convex Lens', 3, 'A gentler converging lens: focus 3 cells away.');
thinLens('planoconcave', 'Plano-Concave Lens', -2, 'A gentler diverging lens: virtual focus 2 cells back.');
thinLens('posmeniscus', 'Positive Meniscus', 4, 'Weak converging lens: focus 4 cells away.');
thinLens('negmeniscus', 'Negative Meniscus', -3, 'Weak diverging lens: virtual focus 3 cells back.');
thinLens('aspheric', 'Aspheric Lens', 1.5, 'Strong, aberration-free converging lens: focus 1½ cells away.');
thinLens('fresnel', 'Fresnel Lens', 2.5, 'A flattened convex lens cut into rings: focus 2½ cells away.');
def('ball', { name: 'Ball Lens', rot: 1, cat: 'lens', f: 1,
  desc: 'A glass sphere. Focuses light 1 cell past its centre from any direction — no rotation needed.',
  geo: () => [{ k: 'ball', c: v(0, 0), h: 0.36, f: 1 }] });
def('microlens', { name: 'Microlens Array', rot: 4, cat: 'lens', f: 0.5,
  desc: 'Three tiny lenses stacked. One beam becomes three focal points ½ cell away.',
  geo: () => [-0.28, 0, 0.28].map(o => ({ k: 'thin', c: v(0, o), a: v(1, 0), h: 0.14, f: 0.5, kind: 'lens' })) });

function thinMirror(id, name, f, desc, h) {
  def(id, { name, rot: 8, cat: 'curved', f, desc,
    geo: () => [{ k: 'thin', c: v(0, 0), a: v(1, 0), h: h || H, f, kind: 'mirror' }] });
}
thinMirror('concavemirror', 'Concave Mirror', 2, 'Reflects parallel light to a focus 2 cells in front. Its back is dark.');
thinMirror('convexmirror', 'Convex Mirror', -2, 'Reflects light outward, spreading it from a point 2 cells behind.');
thinMirror('parabolic', 'Parabolic Mirror', 1.5, 'A perfect focusing mirror: parallel light meets 1½ cells in front.', 0.46);
thinMirror('elliptical', 'Elliptical Mirror', 1, 'Light from a point 2 cells in front is gathered to a point 2 cells in front on the other side of the axis.', 0.46);

function poly(id, o) { def(id, Object.assign({ cat: 'glass' }, o)); }
poly('plate', { name: 'Flat Glass Plate', rot: 4, desc: 'Light passes through. Tilted, it slips sideways but keeps its direction.',
  geo: () => [{ k: 'body', pts: [v(-0.09, -H), v(0.09, -H), v(0.09, H), v(-0.09, H)] }] });
poly('block', { name: 'Tilted Glass Block', rot: 4, desc: 'A thick slab: tilted 45°, it shifts a beam about ¼ cell sideways.',
  geo: () => [{ k: 'body', pts: [v(-0.24, -H), v(0.24, -H), v(0.24, H), v(-0.24, H)] }] });
poly('rightprism', { name: 'Right-Angle Prism', rot: 8, desc: 'Light entering the long face is totally reflected twice and sent back, flipped.',
  geo: () => [{ k: 'body', pts: [v(-0.21, -H), v(0.21, 0), v(-0.21, H)] }] });
poly('prism', { name: 'Dispersion Prism', rot: 8, desc: 'Bends light; splits white into red, green and blue at different angles.',
  geo: () => [{ k: 'body', disp: true, pts: [v(0, -0.4), v(0.3464, 0.2), v(-0.3464, 0.2)] }] });

/* fixed level furniture */

function drawBoard(ctx, L, items, res, o) {

  ctx.fillStyle = bg; ctx.fillRect(0, 0, W * c, Hh * c);

  ctx.strokeStyle = 'rgba(64,224,255,.09)';
  ctx.beginPath();
  for (let x = 1; x < W; x++) { ctx.moveTo(x, 0); ctx.lineTo(x, Hh); }
  for (let y = 1; y < Hh; y++) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(64,224,255,.28)';
  for (let x = 1; x < W; x++) for (let y = 1; y < Hh; y++) { ctx.fillRect(x - 1.2 / c, y - 1.2 / c, 2.4 / c, 2.4 / c); }

  ctx.strokeStyle = 'rgba(64,224,255,.35)'; ctx.lineWidth = 2 / c; ctx.strokeRect(1 / c, 1 / c, W - 2 / c, Hh - 2 / c);

  if (o.mine) items.forEach((it, i) => { if (o.mine.has(i)) { ctx.fillStyle = i === o.sel ? 'rgba(64,224,255,.12)' : 'rgba(64,224,255,.045)'; ctx.fillRect(it.x + 0.04, it.y + 0.04, 0.92, 0.92); } });
  // armed: show empty cells you can place on
  if (o.armedCells) { ctx.fillStyle = 'rgba(64,224,255,.05)'; for (const k of o.armedCells) { const [x, y] = k.split(',').map(Number); ctx.fillRect(x + 0.3, y + 0.3, 0.4, 0.4); } }

  items.forEach((it, i) => { if (it.t === 'wall' || it.t === 'slit' || it.t === 'slot') drawPiece(ctx, it, t); });
  // beams
  if (res) drawBeams(ctx, res, c, t, o.flash);
  // pieces above beams
  items.forEach((it, i) => {
    if (it.t === 'wall' || it.t === 'slit' || it.t === 'slot') return;
    drawPiece(ctx, it, t, { lit: res && it.t === 'target' && res.lit[i] === B.MASK[it.c || 'Y'], rejected: res && res.rejected && res.rejected[i] });
    if (it.fixed && !B.SOURCE_TYPES[it.t] && it.t !== 'target' && o.mine) { // locked tick
      ctx.fillStyle = 'rgba(139,143,152,.6)'; const s = 0.07;
      ctx.fillRect(it.x + 0.06, it.y + 0.06, s, 0.02); ctx.fillRect(it.x + 0.06, it.y + 0.06, 0.02, s);
      ctx.fillRect(it.x + 0.94 - s, it.y + 0.92, s, 0.02); ctx.fillRect(it.x + 0.92, it.y + 0.94 - s, 0.02, s);

  }
  if (o.ghost) {
    const g = o.ghost.it;
    if (o.ghost.valid) {
      const pulse = 0.55 + 0.35 * Math.sin(t * 5);
      ctx.fillStyle = 'rgba(64,224,255,' + (0.10 * pulse) + ')'; ctx.fillRect(g.x + 0.04, g.y + 0.04, 0.92, 0.92);
      ctx.strokeStyle = 'rgba(64,224,255,' + pulse + ')'; ctx.lineWidth = 1.5 / c; ctx.setLineDash([3 / c, 3 / c]);
      ctx.strokeRect(g.x + 0.04, g.y + 0.04, 0.92, 0.92); ctx.setLineDash([]);
    }
    ctx.globalAlpha = o.ghost.valid ? 0.85 : 0.35;

function drawFocal(ctx, it, c) {

let stack = ['title'];

  if (push !== false) stack.push(id);

}

  onEnter(id);
}

$$('[data-back]').forEach(b => b.addEventListener('click', () => { if ($('#s-game').classList.contains('on')) { leaveGame(); game.L = null; } back(); }));

function totalStars() { return Object.values(S.done).reduce((a, b) => a + b, 0); }
function packSolved(pi) { return PACKS[pi].levels.filter((_, li) => S.done[(pi + 1) + '-' + (li + 1)]).length; }
function packOpen(pi) { return S.dev || pi === 0 || packSolved(pi - 1) >= 9; }

  const n = PACKS.reduce((a, p, i) => a + packSolved(i), 0), tot = PACKS.reduce((a, p) => a + p.levels.length, 0);

/* ---------- packs & levels ---------- */
let curPack = 0;
function renderPacks() {
  const el = $('#packlist'); el.innerHTML = '';
  PACKS.forEach((p, i) => {
    const open = packOpen(i), solved = packSolved(i);
    const b = document.createElement('button');
    b.className = 'pack ' + (open ? 'open' : 'locked');
    b.innerHTML = '<div class="pn">' + (i + 1) + '</div><div><h3>' + p.name + '</h3><p>' + p.sub + (open ? '' : ' · solve 9 in pack ' + i + ' to open') + '</p><div class="bar"><i style="width:' + (solved / p.levels.length * 100) + '%"></i></div></div><div class="ps">' + solved + '/' + p.levels.length + '</div>';
    if (open) b.addEventListener('click', () => { curPack = i; renderLevels(); show('levels'); });
    el.appendChild(b);

    d.innerHTML = '<div class="pn">' + (PACKS.length + j + 1) + '</div><div><h3>' + p.name + '</h3><p>' + p.sub + '</p></div><div class="ps">in the lab</div>';

function renderLevels() {
  const p = PACKS[curPack];

  const g = $('#lvgrid'); g.innerHTML = '';
  p.levels.forEach((L, li) => {

/* ---------- game ----------

const game = { active: false, L: null, id: null, base: [], mine: [], items: [], res: null, pres: null, sel: null, undo: [], armed: null, trayRot: {}, pending: null, alarms: 0, alarmFx: null, daily: false, meta: {} };
const cv = $('#board'), ctx = cv.getContext('2d');
let cell = 40, raf = 0;
const now = () => performance.now() / 1000;

function startLevel(pi, li) {
  const L = PACKS[pi].levels[li], id = (pi + 1) + '-' + (li + 1);

function openGame(L, id, title, meta, daily) {
  Object.assign(game, { active: true, L, id, base: B.baseItems(L), mine: [], sel: null, undo: [], armed: null, trayRot: {}, pending: null, pres: null, alarms: 0, alarmFx: null, daily, meta,
    pi: daily ? -1 : +id.split('-')[0] - 1, li: daily ? -1 : +id.split('-')[1] - 1 });

}
window.addEventListener('resize', () => { if (game.active) layout(); if (bench.on) benchLayout(); });

/* tracing */

    drawBoard(ctx, game.L, game.items, shownRes(), { cell, t, sel: game.pending ? null : game.sel, ghost, mine: mineSet(), alarm: game.alarmFx });
    raf = requestAnimationFrame(tick);

/* tray */
function trayLeft(type) {

}

  const el = $('#tray'); el.innerHTML = '';
  Object.keys(game.L.tray).forEach(type => {
    const left = trayLeft(type);
    const d = document.createElement('div'); const stagedHere = game.pending && !game.pending.orig && game.pending.t === type;
    d.className = 'chip' + (left || stagedHere ? '' : ' empty') + (game.armed === type ? ' armed' : ''); d.dataset.type = type;
    const c = document.createElement('canvas'); d.appendChild(c); icon(c, type, stagedHere ? game.pending.r : game.trayRot[type]);
    d.insertAdjacentHTML('beforeend', '<div class="cn">' + B.P[type].name + '</div><div class="cc">×' + left + '</div>' + (S.seen[type] ? '' : '<i class="new"></i>'));
    el.appendChild(d);

  const tgt = rotTarget();
  $('#b-undo').disabled = !game.undo.length && !game.pending && !game.armed;
  $('#b-reset').disabled = !game.mine.length && !game.alarms && !game.pending;
  const pb = $('#b-place'); pb.disabled = !game.pending; pb.classList.toggle('ready', !!game.pending);
}
function rotTarget() {

  if (game.sel != null && game.sel >= game.base.length && B.P[game.items[game.sel].t].rot > 1) return 'sel';

/* occupancy */
function occupiedBy(x, y) {
  if (game.pending && game.pending.x === x && game.pending.y === y) return 'pending';
  const i = game.items.findIndex(it => it.x === x && it.y === y);
  return i < 0 ? null : i;
}
function freeCell(x, y) { return x >= 0 && y >= 0 && x < game.L.w && y < game.L.h && occupiedBy(x, y) === null; }

/* commits — the only place alarms can happen */
function snapshot() { game.undo.push(JSON.stringify(game.mine)); if (game.undo.length > 80) game.undo.shift(); }
function commit() {
  retrace(); renderTray();

  if (r.win) { renderAlarms(); return setTimeout(succeed, 380); }
  if (r.rim > 0) raiseAlarm();
}
function raiseAlarm() {
  game.alarms++;
  const allow = game.meta.allow || 0, red = game.alarms > allow;
  game.alarmFx = { t0: now(), red };
  if (red) { buzz([60, 40, 60, 40, 60]); sfx.alarm(); } else { buzz(25); sfx.expected(); }
  renderAlarms(true);
}
function renderAlarms(pop) {
  const allow = game.meta.allow || 0, n = game.alarms, el = $('#g-alarms');
  let pips = '';
  for (let i = 0; i < allow; i++) pips += '<i class="pip exp' + (i < n ? ' used' : '') + (pop && i === n - 1 ? ' pop' : '') + '"></i>';
  for (let i = allow; i < n; i++) pips += '<i class="pip over' + (pop && i === n - 1 ? ' pop' : '') + '"></i>';
  if (!pips) pips = '<i class="pip none"></i>';
  const over = Math.max(0, n - allow);
  el.innerHTML = '<div class="pips">' + pips + '</div><div class="al">' + (over ? '<span class="bad">' + over + (over === 1 ? ' alarm' : ' alarms') + ' over</span>' : allow ? (allow - n) + (allow - n === 1 ? ' expected alarm left' : ' expected alarms left') : 'no alarms expected') + '</div>';
}
function placeNow(type, x, y, r) {
  snapshot(); game.mine.push({ t: type, x, y, r });

}
function commitPending() {

    game.undo.push(JSON.stringify(game.mine.concat([p.orig])));

}

}
function liftSelected() { // a placed piece becomes a staged preview so it can be turned without counting

}
function rotate(dir) {

  const nT = r.targets.length, lit = r.targets.filter(i => r.lit[i] === B.MASK[(game.items[i] || {}).c || 'Y']).length;
  const parts = [];

    else {
      parts.push('<span class="pv">Preview</span>');
      parts.push(lit + ' of ' + nT + ' lit');

/* pointer handling */
const ghostCv = $('#ghost'), gctx = ghostCv.getContext('2d');
const drag = { on: false, from: null, type: null, idx: null, sx: 0, sy: 0, moved: false, ghost: null, preview: null, r: 0, lp: 0 };
function boardCell(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / cell, y = (e.clientY - r.top) / cell;
  return { x: Math.floor(x), y: Math.floor(y), inside: x >= 0 && y >= 0 && x < game.L.w && y < game.L.h };
}
function showGhost(e, type, r) {
  ghostCv.style.display = 'block'; ghostCv.style.left = e.clientX + 'px'; ghostCv.style.top = (e.clientY - 40) + 'px';
  gctx.setTransform(128, 0, 0, 128, 0, 0); gctx.clearRect(0, 0, 1, 1); drawPiece(gctx, { t: type, x: 0, y: 0, r }, 0);
}
function setPreview(it) {
  const same = drag.preview && it && drag.preview.x === it.x && drag.preview.y === it.y;
  if (same) return;
  drag.preview = it; previewTrace();
}
function dragMove(e) {

    drag.moved = true; clearTimeout(drag.lp);
    if (drag.from === 'board') { const m = game.mine.splice(drag.idx - game.base.length, 1)[0]; drag.type = m.t; drag.r = m.r; drag.orig = m; game.sel = null; retrace(); }
    if (drag.from === 'pending') { drag.type = game.pending.t; drag.r = game.pending.r; drag.pend = game.pending; game.pending = null; retrace(); }
  }
  if (!drag.moved) return;
  const bc = boardCell({ clientX: e.clientX, clientY: e.clientY - (e.pointerType === 'touch' ? 44 : 0) });
  const ok = bc.inside && freeCell(bc.x, bc.y);

    ghostCv.style.display = 'none';
    const it = { t: drag.type, x: bc.x, y: bc.y, r: drag.r };
    drag.ghost = { it, valid: ok };

function dragEnd() {

        const D = B.P[drag.type].rot; if (D === 1) return;

    game.sel = drag.idx; game.armed = null; renderTray(); return;

  game.undo.push(JSON.stringify(game.mine.concat([drag.orig])));
  if (at) { game.mine.push({ t: drag.type, x: at.x, y: at.y, r: drag.r }); sfx.place(); commit(); }
  else if (!overBoard) { sfx.place(); commit(); } // dragged off the board: back to the tray (a commit like any other)
  else { game.mine.push(drag.orig); game.undo.pop(); retrace(); renderTray(); } // dropped on a blocked cell: no change

$('#tray').addEventListener('pointerdown', e => {
  const ch = e.target.closest('.chip'); if (!ch || !game.active) return;
  const type = ch.dataset.type;
  const openLab = () => { const ent = LAB.find(x => x.id === type); if (ent) { buzz(10); drag.on = false; leaveGame(); openBench(ent); } };
  clearTimeout(drag.lp);
  const staged = game.pending && !game.pending.orig && game.pending.t === type;
  if (!trayLeft(type) && !staged) { drag.lp = setTimeout(openLab, 550); return; }
  Object.assign(drag, { on: true, from: 'tray', type, sx: e.clientX, sy: e.clientY, moved: false, r: game.trayRot[type] });
  drag.lp = setTimeout(() => { if (drag.on && !drag.moved) openLab(); }, 550);

  if (occ !== null && occ >= game.base.length) {

$('#b-place').addEventListener('click', commitPending);

function starsFor(used, alarms) {
  const m = game.meta || {}, extraPieces = m.min != null && used > m.min ? 1 : 0, over = Math.max(0, alarms - (m.allow || 0));

}

  if (game.daily) S.daily[game.id] = Math.max(S.daily[game.id] || 0, stars);
  else S.done[game.id] = Math.max(S.done[game.id] || 0, stars);
  persist();

  const next = !game.daily && game.li + 1 < PACKS[game.pi].levels.length ? [game.pi, game.li + 1] : (!game.daily && game.pi + 1 < PACKS.length && packOpen(game.pi + 1) ? [game.pi + 1, 0] : null);

    '<div class="stars">' + [1, 2, 3].map(k => '<span class="' + (stars >= k ? 'on' : '') + '">★</span>').join('') + '</div><ul>' +
    '<li class="ok">Every ray landed</li>' +
    '<li class="' + (sc.extraPieces ? '' : 'ok') + '">' + used + ' piece' + (used === 1 ? '' : 's') + ' used' + (m.min != null ? ' · fewest possible ' + m.min : '') + '</li>' +
    '<li class="' + (sc.over ? '' : 'ok') + '">' + game.alarms + ' alarm' + (game.alarms === 1 ? '' : 's') + ' · ' + (allow ? allow + ' expected' : 'none expected') + (sc.over ? ' · −' + sc.over + '★' : '') + '</li></ul>' +
    '<div class="row"><button id="c-again">Replay</button>' + (next ? '<button class="go" id="c-next">Next</button>' : '<button class="go" id="c-done">Done</button>') + '</div>';

/* ---------- daily ---------- */
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function niceDate() { return new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
let dailyBusy = false;
function startDaily() {
  const dk = dayKey();
  let cached = null; try { cached = JSON.parse(localStorage.getItem('beams.daily') || 'null'); } catch (e) {}
  if (cached && cached.day === dk && cached.L) return openDaily(cached.L, dk);
  if (dailyBusy) return;
  dailyBusy = true; $('#m-daily').textContent = 'building today’s puzzle…';
  const dow = new Date().getDay(), opts = { k: (dow === 0 || dow >= 5) ? 5 : 4, lasers: hash(dk) % 3 === 0 ? 2 : 1, walls: 5, limit: 25000 };
  const done = L => {
    dailyBusy = false;
    if (!L) { $('#m-daily').textContent = 'could not build today’s puzzle'; return; }
    try { localStorage.setItem('beams.daily', JSON.stringify({ day: dk, L })); } catch (e) {}
    openDaily(L, dk);
  };
  try { // build off the main thread so the menu stays responsive
    const src = document.getElementById('core').textContent + '\nonmessage=e=>{postMessage(BEAMS_GEN.generate(e.data.seed,e.data.opts));};';
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    w.onmessage = e => { w.terminate(); done(e.data); };
    w.onerror = () => { w.terminate(); setTimeout(() => done(window.BEAMS_GEN.generate(hash(dk), opts)), 30); };
    w.postMessage({ seed: hash(dk), opts });
  } catch (e) { setTimeout(() => done(window.BEAMS_GEN.generate(hash(dk), opts)), 30); }
}
function openDaily(L, dk) {
  L.map = L.map || [];
  const sol = L.sol || [];
  openGame(L, dk, 'Daily · ' + niceDate(), { min: sol.length, allow: B.alarmAllowance(L, sol) }, true);
}

  { sec: 'Lenses', id: 'microlens', pack: 7, items: [{ t: 'microlens', x: 2, y: 2, r: 0, play: 1 }], src: 'bundle' },
  { sec: 'Lenses', id: 'bulblens', name: 'Bulb and lens', pack: 2, desc: 'A point of light placed at a lens’s focal point leaves as a parallel beam. Move it further away and the lens forms an image instead.', items: [{ t: 'convex', x: 2, y: 2, r: 0, play: 1 }], src: 'bulb', sx: 0 },
  { sec: 'Curved mirrors', id: 'concavemirror', pack: 4, items: [{ t: 'concavemirror', x: 5, y: 2, r: 4, play: 1 }], src: 'bundle' },
  { sec: 'Curved mirrors', id: 'convexmirror', pack: 4, items: [{ t: 'convexmirror', x: 5, y: 2, r: 4, play: 1 }], src: 'bundle' },
  { sec: 'Curved mirrors', id: 'parabolic', pack: 4, items: [{ t: 'parabolic', x: 5, y: 2, r: 4, play: 1 }], src: 'bundle' },
  { sec: 'Curved mirrors', id: 'elliptical', pack: 4, items: [{ t: 'elliptical', x: 5, y: 2, r: 4, play: 1 }], src: 'bulb', bulbAt: { x: 3, y: 1, ang: Math.atan2(1, 2), spread: 9 } },
  { sec: 'Glass and prisms', id: 'plate', pack: 3, items: [{ t: 'plate', x: 3, y: 2, r: 1, play: 1 }], src: 'laser' },
  { sec: 'Glass and prisms', id: 'block', pack: 3, items: [{ t: 'block', x: 3, y: 2, r: 1, play: 1 }], src: 'laser' },
  { sec: 'Glass and prisms', id: 'rightprism', pack: 3, items: [{ t: 'rightprism', x: 4, y: 2, r: 0, play: 1 }], src: 'bundle' },
  { sec: 'Glass and prisms', id: 'prism', pack: 5, items: [{ t: 'prism', x: 3, y: 2, r: 1, play: 1 }], src: 'white' },
  { sec: 'Glass and prisms', id: 'newton', name: 'Newton’s Prisms', pack: 5, desc: 'One prism spreads white light into colours; a second, turned the other way, pulls them back together.', items: [{ t: 'prism', x: 2, y: 2, r: 1, play: 1 }, { t: 'prism', x: 4, y: 3, r: 5, play: 1 }], src: 'white', sy: 2, h: 6 },
  { sec: 'Instruments', id: 'kepler', name: 'Keplerian Telescope', pack: 7, desc: 'Two converging lenses spaced by the sum of their focal lengths: parallel in, parallel out, flipped upside down.', items: [{ t: 'convex', x: 1, y: 2, r: 0, play: 1 }, { t: 'convex', x: 5, y: 2, r: 0, play: 1 }], src: 'bundle', w: 8 },
  { sec: 'Instruments', id: 'galileo', name: 'Galilean Telescope', pack: 7, desc: 'A diverging lens before a converging one widens a beam without flipping it.', items: [{ t: 'concave', x: 2, y: 2, r: 0, play: 1 }, { t: 'convex', x: 3, y: 2, r: 0, play: 1 }], src: 'bundle', narrow: 1 },
];
LAB.forEach(e => { const d = B.P[e.id]; e.name = e.name || (d && d.name); e.desc = e.desc || (d && d.desc); });
function labOpen(e) { return S.dev || e.pack <= PACKS.length || true; }
function renderLab() {
  const el = $('#lablist'); el.innerHTML = ''; let sec = '';
  LAB.forEach(e => {
    if (e.sec !== sec) { sec = e.sec; el.insertAdjacentHTML('beforeend', '<div class="lsec">' + sec + '</div>'); }
    const b = document.createElement('button'); b.className = 'litem';
    const c = document.createElement('canvas');
    b.appendChild(c); icon(c, e.items[0].t, e.items[0].r, 52);
    b.insertAdjacentHTML('beforeend', '<div><b>' + e.name + '</b><small>' + e.desc + '</small></div><div class="tagp">pack ' + e.pack + (e.pack > PACKS.length ? ' · soon' : '') + '</div>');
    b.addEventListener('click', () => openBench(e));
    el.appendChild(b);
  });
}
const bench = { on: false, e: null, items: [], L: null, src: 'bundle', cell: 40, sel: null };
const bcv = $('#bench'), bctx = bcv.getContext('2d');
let braf = 0;
function openBench(e) {
  bench.on = true; bench.e = e; bench.src = e.src; bench.L = { w: e.w || 7, h: (e.h || 5) + 2 };
  bench.pieces = e.items.map(it => Object.assign({}, it, { y: it.y + 1 }));
  $('#bn-title').textContent = e.name; $('#bn-sub').textContent = 'Pack ' + e.pack + (e.pack > PACKS.length ? ' · coming soon' : '');
  $('#bn-desc').textContent = e.desc;
  const d = B.P[e.items[0].t];
  $('#bn-facts').textContent = d && d.f != null && !e.name.includes('Telescope') ? 'Focal length ' + (d.f > 0 ? '' : '−') + Math.abs(d.f) + (Math.abs(d.f) === 1 ? ' cell' : ' cells') + (d.f < 0 ? ' (virtual)' : '') : '';
  const segs = e.src === 'white' ? [['white', 'White laser'], ['laser', 'Gold laser']] : e.src === 'bulb' ? [['bulb', 'Bulb']] : [['bundle', 'Beam'], ['laser', 'Laser']];
  if (e.src !== 'white' && e.src !== 'bulb' && e.src === 'laser') segs.reverse();
  $('#bn-src').innerHTML = segs.map(s => '<button data-s="' + s[0] + '" class="' + (s[0] === bench.src ? 'on' : '') + '">' + s[1] + '</button>').join('');
  $$('#bn-src button').forEach(b => b.onclick = () => { bench.src = b.dataset.s; $$('#bn-src button').forEach(x => x.classList.toggle('on', x === b)); benchTrace(); });
  show('bench'); benchLayout(); benchTrace();
  cancelAnimationFrame(braf);
  const tick = ts => { if (!bench.on || !$('#s-bench').classList.contains('on')) { bench.on = false; return; } bctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawBoard(bctx, bench.L, bench.all, bench.res, { cell: bench.cell, t: ts / 1000, sel: bench.sel }); braf = requestAnimationFrame(tick); };
  braf = requestAnimationFrame(tick);
}
function benchLayout() {
  const w = Math.min(window.innerWidth - 32, 460), L = bench.L;
  bench.cell = Math.floor(w / L.w);
  bcv.width = bench.cell * L.w * DPR; bcv.height = bench.cell * L.h * DPR;
  bcv.style.width = bench.cell * L.w + 'px'; bcv.style.height = bench.cell * L.h + 'px';
  bcv.style.marginTop = '14px';
}
function benchTrace() {
  const e = bench.e, sy = (e.sy != null ? e.sy : 2) + 1, sx = e.sx != null ? e.sx : 0;
  let src;
  if (bench.src === 'bulb') src = e.bulbAt ? Object.assign({ t: 'bulb', r: 0 }, e.bulbAt, { y: e.bulbAt.y + 1 }) : { t: 'bulb', x: sx, y: sy, r: 0 };
  else src = { t: bench.src === 'white' ? 'laser' : bench.src, x: sx, y: sy, r: 0, c: bench.src === 'white' ? 'W' : 'Y', n: e.narrow ? 3 : undefined };
  if (src.t === 'bundle' && e.narrow) src.n = 3;
  bench.all = [Object.assign({ fixed: true }, src)].concat(bench.pieces);
  bench.res = B.trace(bench.L, bench.all);
}
bcv.addEventListener('pointerdown', e => {
  const r = bcv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / bench.cell), y = Math.floor((e.clientY - r.top) / bench.cell);
  const i = bench.pieces.findIndex(p => p.x === x && p.y === y);
  if (i < 0) { bench.sel = null; return; }
  const p = bench.pieces[i];
  if (B.P[p.t].rot > 1) { p.r = (p.r + 1) % 8; sfx.rot(); }
  bench.sel = i + 1; benchTrace();
});

/* ---------- settings ---------- */
function renderSettings() { $$('[data-set]').forEach(b => b.querySelector('.tog').classList.toggle('on', !!S.set[b.dataset.set])); }
$$('[data-set]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.set; S.set[k] = !S.set[k]; persist(); renderSettings(); if (k === 'haptics') buzz(20); if (k === 'sound') sfx.place(); }));
let resetArm = 0;
$('#reset-progress').addEventListener('click', e => {
  const b = e.currentTarget;
  if (Date.now() - resetArm < 3000) { S.done = {}; S.daily = {}; S.dev = false; persist(); b.querySelector('small').textContent = 'Progress cleared'; resetArm = 0; return; }
  resetArm = Date.now(); b.querySelector('small').textContent = 'Tap again within 3 seconds to clear everything';
});

/* ---------- visit counter ---------- */
let visitsText = '';
(function visits() {
  if (location.hostname !== 's77ffy.github.io') return;
  const p = location.pathname.replace(/index\.html$/, '');
  fetch('https://s77ffy.goatcounter.com/counter/' + encodeURIComponent(p) + '.json').then(r => r.status === 404 ? { count: '0' } : r.json()).then(j => {
    visitsText = j.count + ' visits'; $('#visits').textContent = visitsText;
    $('#ver-title').textContent = verText + ' · ' + visitsText;
  }).catch(() => {});
})();

/* ---------- title hero: a live optical bench sweeping behind the wordmark ---------- */
const hcv = $('#hero'), hctx = hcv.getContext('2d');
let hraf = 0;
function startHero() {
  cancelAnimationFrame(hraf);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick = ts => {
    const w = hcv.clientWidth, h = hcv.clientHeight;
    if (hcv.width !== w * DPR) { hcv.width = w * DPR; hcv.height = h * DPR; }
    const c = Math.max(w / 7, h / 13), L = { w: Math.ceil(w / c), h: Math.ceil(h / c) };
    const t = reduce ? 2 : ts / 1000;
    const midY = Math.floor(L.h * 0.43);
    const items = [
      { t: 'laser', x: 0, y: midY, r: 0, c: 'W', ang: 0.035 * Math.sin(t * 0.6) },
      { t: 'prism', x: 2, y: midY, r: 3 },
    ];
    const res = B.trace(L, items);
    hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    hctx.globalAlpha = 1;
    drawBoard(hctx, L, items, res, { cell: c, t });
    // fade toward the menu
    const g = hctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(22,23,26,.35)'); g.addColorStop(0.5, 'rgba(22,23,26,.15)'); g.addColorStop(1, 'rgba(22,23,26,.75)');
    hctx.fillStyle = g; hctx.fillRect(0, 0, w, h);
    if (!reduce) hraf = requestAnimationFrame(tick);
  };
  hraf = requestAnimationFrame(tick);
}
function stopHero() { cancelAnimationFrame(hraf); }

refreshTitle(); startHero();
})();
